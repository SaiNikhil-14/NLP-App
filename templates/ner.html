<!DOCTYPE html>
<html>
    <head>
        <title>NLP App | NER</title>
    </head>
    <body>
        <form action="/perform_ner" method="post">
            <label>Type your text here: -</label><br>
            <textarea name="ner_text"></textarea><br><br>
            <input type="submit" value="Perform NER">
        </form>

        {% if response %}
            <!-- We found the structure of the json using json viewer and according to the structure we made a loop-->
            {%for i in response.entities:%}
                <p>{{i.text}} -> {{i.label}}</p>
            {% endfor %}
        {% endif %}
    </body>
</html>
