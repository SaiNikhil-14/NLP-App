<!DOCTYPE html>
<html>
    <head>
        <title>NLP App | Sentiment Analysis</title>
    </head>
    <body>
        <form action="/perform_sentiment" method="post">
            <label>Type your text here: -</label><br>
            <textarea name="sentiment_text"></textarea><br><br>
            <input type="submit" value="Perform analysis">
        </form>

        {% if result %}
            <p>Sentiment: {{result.sentiment}}</p>
            <p>Summary: {{result.summary}}</p>
        {% endif %}
    </body>
</html>
