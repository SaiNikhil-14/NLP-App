<!DOCTYPE html>
<html>
    <head>
        <title>NLP App | Login Page</title>
    </head>
    <body>
        <h1>NLP App</h1>

        <h3>Login Here</h3>

        <!-- Jinja template is wrtitng python if-else and loops in html-->
        {% if message %}
            <p style="color:green">{{ message }}</p>
        {% endif %}

        <form action="/Verify" method="post">
            <label>Email: </label>
            <input type="email" placeholder="Enter your email here" name="entered_email" required><br>
            <br>
            <label>Password: </label>
            <input type="password" placeholder="Enter your password" name="entered_password" required><br>
            <br>
            <input type="submit" value="login">
        </form>

        <p>Not a member? <a href="/register">Register here</a></p>
    </body>
</html>
